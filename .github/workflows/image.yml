name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: |
          for script in entrypoint.sh status.sh tests/runtime.sh; do
            bash -n "$script"
          done
      - name: Build x86_64 image
        run: docker build --platform linux/amd64 -t wireguard:test .
      - name: Load kernel WireGuard on disposable runner
        run: sudo modprobe wireguard
      - name: Runtime tests
        run: bash tests/runtime.sh
      - name: Save the tested image
        if: github.event_name == 'push'
        run: docker save -o "$RUNNER_TEMP/wireguard.tar" wireguard:test
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: tested-image
          path: ${{ runner.temp }}/wireguard.tar
          retention-days: 1
          compression-level: 0

  dockerhub:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/wireguard.tar"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested Docker Hub image
        run: |
          docker tag wireguard:test "zhdkirill/wireguard:$GITHUB_SHA"
          docker tag wireguard:test zhdkirill/wireguard:latest
          docker push "zhdkirill/wireguard:$GITHUB_SHA"
          docker push zhdkirill/wireguard:latest
      - name: Record immutable image reference
        run: docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "zhdkirill/wireguard:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  ghcr:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/wireguard.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
      - name: Publish tested GHCR image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag wireguard:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Record immutable image reference
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE_TAGS%%$'\n'*}" >> "$GITHUB_STEP_SUMMARY"
